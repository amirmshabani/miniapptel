<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#229ED9" />
  <title>Common Ground</title>

  <style>
    :root {
      --blue: #229ed9;
      --blue-dark: #168ac2;
      --bg: #f4f7f9;
      --surface: #fff;
      --text: #18212b;
      --muted: #75818d;
      --border: #e8edf1;
      --chip: #edf7fc;
      --shadow: 0 8px 24px rgba(28, 51, 71, .06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: auto;
      padding-bottom: 90px;
      background: var(--bg);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(244,247,249,.94);
      backdrop-filter: blur(14px);
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 13px;
      background: var(--blue);
      color: white;
    }
    .brand-mark svg { width: 23px; height: 23px; fill: currentColor; }
    .brand-name { font-size: 17px; font-weight: 750; letter-spacing: -.4px; }
    .demo-label { color: var(--muted); font-size: 11px; }

    main { padding: 8px 16px 24px; }
    .intro { padding: 10px 4px 18px; }
    .intro h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.8px; }
    .intro p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }

    .search-wrap { position: relative; margin-bottom: 14px; }
    .search-icon {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: var(--muted);
    }
    .search, .field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      outline: none;
      background: white;
      color: var(--text);
    }
    .search { padding-left: 40px; }
    .search:focus, .field:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(34,158,217,.12);
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 1px 0 15px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter {
      flex: 0 0 auto;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: white;
      color: #5c6975;
      font-size: 13px;
    }
    .filter.active { border-color: var(--blue); background: var(--blue); color: white; }

    .cards { display: grid; gap: 13px; }
    .card, .profile-card, .request-card, .chat-box {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 19px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .person { display: flex; align-items: center; gap: 12px; }
    .avatar {
      display: grid;
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      place-items: center;
      border-radius: 17px;
      font-size: 27px;
    }
    .person-info { min-width: 0; flex: 1; }
    .person-info h2 { margin: 0 0 4px; font-size: 16px; }
    .person-info p { margin: 0; color: var(--muted); font-size: 12px; }

    .shared { margin: 14px 0 8px; color: var(--blue-dark); font-size: 12px; font-weight: 700; }
    .bio { margin: 0 0 12px; color: #596672; font-size: 13px; line-height: 1.5; }
    .label {
      margin: 12px 0 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .8px;
      text-transform: uppercase;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 6px 9px; border-radius: 999px; background: var(--chip); color: #2b7699; font-size: 11px; }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
      padding-top: 13px;
      border-top: 1px solid var(--border);
    }

    .button, .connect, .edit-button, .save-button {
      border: 0;
      border-radius: 11px;
      background: var(--blue);
      color: white;
      font-weight: 700;
    }
    .button, .connect { padding: 9px 13px; font-size: 12px; }
    .button.secondary, .connect.sent, .connect.friend {
      background: #eaf6fc;
      color: var(--blue-dark);
    }
    .button.danger { background: #fff0ef; color: #c64b43; }
    .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .muted { color: var(--muted); font-size: 12px; }

    .empty {
      padding: 36px 18px;
      border: 1px dashed #d5e0e7;
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
    .empty strong { display: block; margin-bottom: 5px; color: var(--text); }

    .profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 17px; }
    .profile-head .avatar { width: 64px; height: 64px; flex-basis: 64px; }
    .profile-head h2 { margin: 0 0 4px; font-size: 20px; }
    .profile-head p { margin: 0; color: var(--muted); font-size: 12px; }
    .profile-bio { color: #596672; font-size: 14px; line-height: 1.6; }
    .edit-button, .save-button { width: 100%; margin-top: 18px; padding: 12px; }
    .form { display: grid; gap: 12px; margin-top: 17px; }
    .form label { display: grid; gap: 6px; color: #56636f; font-size: 12px; font-weight: 650; }
    textarea.field { min-height: 74px; resize: vertical; }
    .form-hint { color: var(--muted); font-size: 11px; font-weight: 400; }
    [hidden] { display: none !important; }

    .chat-box { padding: 0; overflow: hidden; }
    .chat-head { display: flex; align-items: center; gap: 10px; padding: 13px; border-bottom: 1px solid var(--border); }
    .chat-head .avatar { width: 42px; height: 42px; flex-basis: 42px; font-size: 22px; }
    .chat-head strong { font-size: 14px; }
    .chat-head .back { margin-left: auto; border: 0; background: transparent; color: var(--blue-dark); }
    .messages { display: grid; gap: 8px; min-height: 190px; max-height: 48vh; overflow-y: auto; padding: 14px; }
    .message { max-width: 82%; padding: 9px 11px; border-radius: 13px; background: #f0f3f5; font-size: 13px; line-height: 1.45; }
    .message.mine { justify-self: end; background: #e4f4fc; }
    .chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
    .chat-form .field { flex: 1; }
    .chat-form button { padding: 0 14px; border: 0; border-radius: 11px; background: var(--blue); color: white; font-weight: 700; }

    .onboarding-wrap { display: grid; min-height: 75vh; align-items: center; padding: 20px 16px; }
    .onboarding { padding: 22px; border: 1px solid var(--border); border-radius: 23px; background: white; box-shadow: var(--shadow); }
    .welcome-mark {
      display: grid; width: 58px; height: 58px; place-items: center;
      border-radius: 20px; background: var(--blue); color: white; margin-bottom: 18px;
    }
    .welcome-mark svg { width: 32px; height: 32px; fill: currentColor; }
    .onboarding h1 { margin: 0 0 8px; font-size: 25px; }
    .onboarding > p { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .onboarding .form { margin: 0; }
    .notice { margin-top: 14px; color: var(--muted); font-size: 11px; line-height: 1.5; }

    .bottom-nav {
      position: fixed;
      z-index: 6;
      right: 0; bottom: 0; left: 0;
      display: flex; justify-content: center;
      padding: 9px 10px max(9px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(14px);
    }
    .nav-inner { display: flex; width: min(100%, 520px); gap: 4px; }
    .nav-button {
      position: relative;
      display: grid; flex: 1; justify-items: center; gap: 4px;
      padding: 7px 3px;
      border: 0; border-radius: 11px;
      background: transparent; color: #84909a; font-size: 10px;
    }
    .nav-button .icon { font-size: 18px; line-height: 1; }
    .nav-button.active { background: #edf7fc; color: var(--blue-dark); font-weight: 700; }
    .badge {
      position: absolute; top: 1px; left: calc(50% + 7px);
      min-width: 15px; padding: 2px 4px; border-radius: 99px;
      background: #e25555; color: white; font-size: 9px;
    }

    .toast {
      position: fixed; z-index: 10; right: 50%; bottom: 86px;
      max-width: calc(100% - 32px); padding: 11px 16px;
      transform: translate(50%, 14px); border-radius: 12px;
      background: #18212b; color: white; font-size: 13px;
      opacity: 0; pointer-events: none; transition: 180ms ease;
    }
    .toast.show { transform: translate(50%, 0); opacity: 1; }

    @media (min-width: 600px) {
      body { padding: 18px 0; }
      .app { min-height: calc(100vh - 36px); border: 1px solid #e5ebef; border-radius: 28px; box-shadow: 0 18px 60px rgba(28,51,71,.1); overflow: hidden; }
      .bottom-nav { right: 50%; bottom: 18px; width: min(100%, 520px); transform: translateX(50%); border-radius: 0 0 28px 28px; }
    }
  </style>

  <script src="telegram-web-app.js"></script>
</head>

<body>
  <div class="app">
    <header class="topbar" id="topbar">
      <div class="brand">
        <div class="brand-mark" aria-label="Telegram-inspired logo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.8 4.2 18.6 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 13.5l-5-1.6c-1.1-.3-1.1-1.1.2-1.6L20.5 2.7c.9-.3 1.6.2 1.3 1.5Z"/></svg>
        </div>
        <div class="brand-name">Common Ground</div>
      </div>
      <div class="demo-label">Local prototype</div>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation" hidden>
      <div class="nav-inner" id="nav-inner"></div>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const API_BASE = "https://miniapptel-2jxo.onrender.com";
    const AVATARS = ["🎨","🎧","🌿","📷","🎬","📚","☕","🎵"];
    const COLORS = ["#fce9df","#e5efff","#e4f4e8","#f2e8ff","#fff4d6","#e0f5f5"];
    const FILTERS = ["All","Cinema","Reading","Music","Travel","Art"];

    let token = "";
    let me = null;
    let page = "discover";
    let filter = "All";
    let query = "";
    let friendQuery = "";
    let chatPersonId = null;
    let searchTimer = null;
    const cache = { requests: [], friends: [] };

    const main = document.getElementById("main");
    const nav = document.getElementById("nav-inner");
    const toast = document.getElementById("toast");

    function esc(v = "") {
      return String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function list(v) { return String(v || "").split(",").map(x => x.trim()).filter(Boolean); }
    function toastMsg(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastMsg.timer);
      toastMsg.timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }
    function avatarFor(id) {
      const n = Number(id) || 0;
      return { emoji: AVATARS[n % AVATARS.length], color: COLORS[n % COLORS.length] };
    }
    function emptyBox(title, text) {
      return `<div class="empty"><strong>${esc(title)}</strong>${esc(text)}</div>`;
    }
    function chipsHTML(items = []) {
      return items.length
        ? items.map(x => `<span class="chip">${esc(x)}</span>`).join("")
        : `<span class="muted">Nothing added yet.</span>`;
    }
    function sharedWithMe(p) {
      const mine = new Set((me.interests || []).map(x => x.toLowerCase()));
      return (p.interests || []).filter(x => mine.has(x.toLowerCase()));
    }
    function profilePayload(d) {
      return {
        name: String(d.get("name")).trim(),
        username: String(d.get("username")).trim().replace(/^@/, ""),
        bio: String(d.get("bio") || "").trim(),
        interests: list(d.get("interests")),
        movies: list(d.get("movies")),
        books: list(d.get("books"))
      };
    }

    async function api(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`,
          ...(options.headers || {})
        }
      });
      let data = {};
      try { data = await res.json(); } catch {}
      if (!res.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    async function login() {
      const tg = window.Telegram?.WebApp;
      const info = `Telegram: ${!!window.Telegram}, WebApp: ${!!tg}, initData length: ${tg?.initData?.length || 0}`;

      if (!tg || !tg.initData) {
        document.getElementById("bottom-nav").hidden = true;
        main.innerHTML = `<div class="onboarding-wrap"><section class="onboarding">
          <h1>Open in Telegram</h1>
          <p>This app works inside Telegram. Open it from the bot's button to sign in.</p>
          <p style="font-size:11px;word-break:break-all">${esc(info)}</p>
        </section></div>`;
        return false;
      }

      tg.ready();
      tg.expand();
      const res = await fetch(`${API_BASE}/api/auth/telegram`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData: tg.initData })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Sign-in failed");
      token = data.token;
      me = data.user;
      return true;
    }

    async function refreshCounts() {
      const [r, f] = await Promise.all([api("/api/requests"), api("/api/friends")]);
      cache.requests = r.requests;
      cache.friends = f.friends;
    }

    async function start() {
      main.innerHTML = `<div class="empty">Loading…</div>`;
      try {
        if (!(await login())) return;
        if (!me.username) { renderOnboarding(); return; }
        await refreshCounts();
        render();
      } catch (e) {
        main.innerHTML = emptyBox("Could not sign in", e.message);
      }
    }

    function renderOnboarding() {
      document.getElementById("bottom-nav").hidden = true;
      main.innerHTML = `
        <div class="onboarding-wrap"><section class="onboarding">
          <div class="welcome-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.8 4.2 18.6 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 13.5l-5-1.6c-1.1-.3-1.1-1.1.2-1.6L20.5 2.7c.9-.3 1.6.2 1.3 1.5Z"/></svg></div>
          <h1>Find your people</h1>
          <p>Meet people through the movies, books, and interests you love.</p>
          <form class="form" id="signup-form">
            <label>Display name<input class="field" name="name" maxlength="40" placeholder="Your name" required></label>
            <label>Username<input class="field" name="username" maxlength="24" placeholder="yourname" required pattern="[A-Za-z0-9_]{3,24}"><span class="form-hint">3–24 characters. Letters, numbers, and underscores.</span></label>
            <label>Short bio<textarea class="field" name="bio" maxlength="180" placeholder="A little about you"></textarea></label>
            <label>Interests<input class="field" name="interests" placeholder="Cinema, Reading, Travel"><span class="form-hint">Separate items with commas.</span></label>
            <label>Favorite movies<input class="field" name="movies" placeholder="Interstellar, Amélie"></label>
            <label>Favorite books<input class="field" name="books" placeholder="The Alchemist, 1984"></label>
            <button class="save-button" type="submit">Create my profile</button>
          </form>
        </section></div>`;

      document.getElementById("signup-form").addEventListener("submit", async e => {
        e.preventDefault();
        try {
          const data = await api("/api/me", { method: "PATCH", body: JSON.stringify(profilePayload(new FormData(e.currentTarget))) });
          me = data.user;
          page = "discover";
          await refreshCounts();
          render();
          toastMsg("Welcome to Common Ground!");
        } catch (err) {
          toastMsg(err.message);
        }
      });
    }

    function render() {
      document.getElementById("bottom-nav").hidden = false;
      renderNav();
      if (page === "discover") loadDiscover();
      else if (page === "requests") loadRequests();
      else if (page === "friends") loadFriends();
      else if (page === "chat") loadChat();
      else renderProfile();
    }

    function renderNav() {
      const incomingCount = cache.requests.filter(r => r.direction === "incoming").length;
      const items = [
        ["discover", "⌕", "Discover", 0],
        ["requests", "↗", "Requests", incomingCount],
        ["friends", "♡", "Friends", 0],
        ["profile", "◉", "Profile", 0]
      ];
      nav.innerHTML = items.map(([id, icon, label, count]) => `
        <button class="nav-button ${page === id || (page === "chat" && id === "friends") ? "active" : ""}" data-page="${id}">
          <span class="icon">${icon}</span><span>${label}</span>${count ? `<span class="badge">${count}</span>` : ""}
        </button>`).join("");
      nav.querySelectorAll("[data-page]").forEach(b => b.addEventListener("click", () => {
        page = b.dataset.page;
        chatPersonId = null;
        render();
      }));
    }

    async function loadDiscover() {
      main.innerHTML = `
        <section class="intro"><h1>Find your people</h1><p>Discover people who love the same things you do.</p></section>
        <div class="search-wrap"><span class="search-icon">⌕</span><input class="search" id="search" placeholder="Search people or interests" value="${esc(query)}" aria-label="Search"></div>
        <div class="filters">${FILTERS.map(x => `<button class="filter ${filter === x ? "active" : ""}" data-filter="${esc(x)}">${esc(x)}</button>`).join("")}</div>
        <section class="cards" id="cards"><div class="empty">Loading…</div></section>`;

      document.getElementById("search").addEventListener("input", e => {
        query = e.target.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(async () => {
          await loadDiscover();
          const s = document.getElementById("search");
          s.focus();
          s.setSelectionRange(s.value.length, s.value.length);
        }, 350);
      });
      main.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
        filter = b.dataset.filter;
        loadDiscover();
      }));

      const params = new URLSearchParams();
      if (query.trim()) params.set("search", query.trim());
      if (filter !== "All") params.set("interest", filter);

      try {
        const { profiles } = await api(`/api/profiles?${params}`);
        const cards = document.getElementById("cards");
        if (!cards) return;
        cards.innerHTML = profiles.length
          ? profiles.map(cardHTML).join("")
          : emptyBox("No profiles found", "Try a different search or interest.");
        cards.querySelectorAll("[data-connect]").forEach(b =>
          b.addEventListener("click", () => sendRequest(b.dataset.connect, b))
        );
      } catch (e) {
        toastMsg(e.message);
      }
    }

    function cardHTML(p) {
      const a = avatarFor(p.id);
      const common = sharedWithMe(p);
      return `<article class="card">
        <div class="person">
          <div class="avatar" style="background:${a.color}">${a.emoji}</div>
          <div class="person-info"><h2>${esc(p.name)}</h2><p>@${esc(p.username)}</p></div>
        </div>
        <div class="shared">${common.length
          ? `${common.length} shared interest${common.length === 1 ? "" : "s"} with you`
          : "A chance to discover something new"}</div>
        <p class="bio">${esc(p.bio)}</p>
        <div class="label">Interests</div><div class="chips">${chipsHTML(p.interests)}</div>
        <div class="label">Favorite movies</div><div class="chips">${chipsHTML(p.movies)}</div>
        <div class="label">Favorite books</div><div class="chips">${chipsHTML(p.books)}</div>
        <div class="card-actions">
          <span class="muted">Say hello and connect.</span>
          <button class="connect" data-connect="${esc(p.id)}">Connect</button>
        </div>
      </article>`;
    }

    async function sendRequest(id, btn) {
      btn.disabled = true;
      try {
        await api(`/api/requests/${id}`, { method: "POST" });
        toastMsg("Request sent");
        await loadDiscover();
      } catch (e) {
        toastMsg(e.message);
        btn.disabled = false;
      }
    }

    async function loadRequests() {
      try { await refreshCounts(); } catch (e) { toastMsg(e.message); }
      const ins = cache.requests.filter(r => r.direction === "incoming");
      const outs = cache.requests.filter(r => r.direction === "outgoing");

      main.innerHTML = `
        <section class="intro"><h1>Requests</h1><p>Accept a request to add someone to your Friends.</p></section>
        <div class="label">Incoming · ${ins.length}</div>
        <section class="cards">${ins.length
          ? ins.map(r => requestHTML(r, true)).join("")
          : emptyBox("No new requests", "When someone wants to connect, their request will appear here.")}</section>
        <div class="label" style="margin-top:20px">Sent · ${outs.length}</div>
        <section class="cards">${outs.length
          ? outs.map(r => requestHTML(r, false)).join("")
          : emptyBox("No sent requests", "Requests you send will appear here.")}</section>`;

      main.querySelectorAll("[data-action]").forEach(b =>
        b.addEventListener("click", () => handleRequest(b.dataset.action, b.dataset.id))
      );
    }

    function requestHTML(r, incoming) {
      const p = r.person;
      const a = avatarFor(p.id);
      const buttons = incoming
        ? `<button class="button" data-action="accept" data-id="${esc(p.id)}">Accept</button>
           <button class="button danger" data-action="decline" data-id="${esc(p.id)}">Decline</button>`
        : `<button class="button secondary" disabled>Request sent</button>
           <button class="button danger" data-action="cancel" data-id="${esc(p.id)}">Cancel</button>`;
      return `<article class="request-card">
        <div class="person">
          <div class="avatar" style="background:${a.color}">${a.emoji}</div>
          <div class="person-info"><h2>${esc(p.name)}</h2><p>@${esc(p.username)} · ${sharedWithMe(p).length} shared interests</p></div>
        </div>
        <p class="bio" style="margin-top:12px">${esc(p.bio)}</p>
        <div class="button-row">${buttons}</div>
      </article>`;
    }

    async function handleRequest(action, id) {
      const paths = { accept: "/accept", decline: "/decline", cancel: "/cancel" };
      const messages = { accept: "Friend added", decline: "Request declined", cancel: "Request cancelled" };
      try {
        await api(`/api/requests/${id}${paths[action]}`, { method: "POST" });
        toastMsg(messages[action]);
        await loadRequests();
      } catch (e) {
        toastMsg(e.message);
      }
    }

    async function loadFriends() {
      try { await refreshCounts(); } catch (e) { toastMsg(e.message); }
      main.innerHTML = `
        <section class="intro"><h1>Friends</h1><p>Your connections, built around what you love.</p></section>
        <div class="search-wrap"><span class="search-icon">⌕</span><input class="search" id="friend-search" placeholder="Search friends" value="${esc(friendQuery)}"></div>
        <section class="cards" id="friend-cards"></section>`;

      document.getElementById("friend-search").addEventListener("input", e => {
        friendQuery = e.target.value;
        drawFriends();
      });

      document.getElementById("friend-cards").addEventListener("click", async e => {
        const chat = e.target.closest("[data-chat]");
        const remove = e.target.closest("[data-remove]");
        if (chat) {
          chatPersonId = chat.dataset.chat;
          page = "chat";
          render();
        }
        if (remove) {
          try {
            await api(`/api/friends/${remove.dataset.remove}`, { method: "DELETE" });
            toastMsg("Friend removed");
            await loadFriends();
          } catch (err) {
            toastMsg(err.message);
          }
        }
      });

      drawFriends();
    }

    function drawFriends() {
      const q = friendQuery.toLowerCase().trim();
      const friends = cache.friends.filter(p =>
        !q || [p.name, p.username, ...(p.interests || [])].join(" ").toLowerCase().includes(q)
      );
      document.getElementById("friend-cards").innerHTML = friends.length
        ? friends.map(friendHTML).join("")
        : emptyBox("No friends yet", "Accept an incoming request or send one from Discover.");
    }

    function friendHTML(p) {
      const a = avatarFor(p.id);
      return `<article class="card">
        <div class="person">
          <div class="avatar" style="background:${a.color}">${a.emoji}</div>
          <div class="person-info"><h2>${esc(p.name)}</h2><p>@${esc(p.username)}</p></div>
        </div>
        <p class="bio" style="margin-top:12px">${esc(p.bio)}</p>
        <div class="button-row">
          <button class="button" data-chat="${esc(p.id)}">Message</button>
          <button class="button danger" data-remove="${esc(p.id)}">Remove friend</button>
        </div>
      </article>`;
    }

    async function loadChat() {
      if (!cache.friends.some(f => f.id === chatPersonId)) {
        try { await refreshCounts(); } catch (e) { toastMsg(e.message); }
      }
      const p = cache.friends.find(f => f.id === chatPersonId);
      if (!p) { page = "friends"; render(); return; }
      const a = avatarFor(p.id);

      main.innerHTML = `
        <section class="intro"><h1>Messages</h1><p>Only friends can message each other.</p></section>
        <section class="chat-box">
          <div class="chat-head">
            <div class="avatar" style="background:${a.color}">${a.emoji}</div>
            <strong>${esc(p.name)}</strong>
            <button class="back" id="back-friends">Back</button>
          </div>
          <div class="messages" id="messages"><div class="empty">Loading…</div></div>
          <form class="chat-form" id="chat-form">
            <input class="field" name="message" maxlength="2000" placeholder="Write a message…" required>
            <button>Send</button>
          </form>
        </section>`;

      document.getElementById("back-friends").addEventListener("click", () => { page = "friends"; render(); });
      document.getElementById("chat-form").addEventListener("submit", sendMessage);
      await loadMessages();
    }

    async function loadMessages() {
      try {
        const { messages } = await api(`/api/messages/${chatPersonId}`);
        const box = document.getElementById("messages");
        if (!box) return;
        box.innerHTML = messages.length
          ? messages.map(m => `<div class="message ${m.senderId === me.id ? "mine" : ""}">${esc(m.text)}</div>`).join("")
          : `<div class="empty">Say hello!</div>`;
        box.scrollTop = box.scrollHeight;
      } catch (e) {
        toastMsg(e.message);
      }
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = e.currentTarget.elements.message;
      const text = input.value.trim();
      if (!text) return;
      try {
        await api(`/api/messages/${chatPersonId}`, { method: "POST", body: JSON.stringify({ text }) });
        input.value = "";
        await loadMessages();
      } catch (err) {
        toastMsg(err.message);
      }
    }

    function renderProfile() {
      const p = me;
      const a = avatarFor(p.id);
      main.innerHTML = `
        <section class="intro"><h1>My profile</h1><p>Your profile helps people find common ground with you.</p></section>
        <section class="profile-card">
          <div class="profile-head">
            <div class="avatar" style="background:${a.color}">${a.emoji}</div>
            <div><h2>${esc(p.name)}</h2><p>@${esc(p.username)}</p></div>
          </div>
          <p class="profile-bio">${esc(p.bio || "Add a short bio to introduce yourself.")}</p>
          <div class="label">Interests</div><div class="chips">${chipsHTML(p.interests)}</div>
          <div class="label">Favorite movies</div><div class="chips">${chipsHTML(p.movies)}</div>
          <div class="label">Favorite books</div><div class="chips">${chipsHTML(p.books)}</div>
          <button class="edit-button" id="edit-profile">Edit profile</button>
          <form class="form" id="profile-form" hidden>
            <label>Display name<input class="field" name="name" maxlength="40" required value="${esc(p.name)}"></label>
            <label>Username<input class="field" name="username" maxlength="24" required pattern="[A-Za-z0-9_]{3,24}" value="${esc(p.username)}"></label>
            <label>Short bio<textarea class="field" name="bio" maxlength="180">${esc(p.bio)}</textarea></label>
            <label>Interests<input class="field" name="interests" value="${esc((p.interests || []).join(", "))}"></label>
            <label>Favorite movies<input class="field" name="movies" value="${esc((p.movies || []).join(", "))}"></label>
            <label>Favorite books<input class="field" name="books" value="${esc((p.books || []).join(", "))}"></label>
            <button class="save-button">Save profile</button>
          </form>
        </section>`;

      document.getElementById("edit-profile").addEventListener("click", () => {
        const f = document.getElementById("profile-form");
        f.hidden = !f.hidden;
      });

      document.getElementById("profile-form").addEventListener("submit", async e => {
        e.preventDefault();
        try {
          const data = await api("/api/me", { method: "PATCH", body: JSON.stringify(profilePayload(new FormData(e.currentTarget))) });
          me = data.user;
          toastMsg("Profile updated");
          renderProfile();
        } catch (err) {
          toastMsg(err.message);
        }
      });
    }

    start();
  </script>
</body>
</html>
